<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to ScholarMatch</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white h-screen flex flex-col justify-between">

    <!-- Background Image with Dark Gradient Overlay -->
    <div class="absolute inset-0 z-0">
        <img src="{{ url_for('static', filename='merit3.jpg') }}" 
             alt="University Campus Background" 
             class="w-full h-full object-cover">
        <!-- Dark overlay to ensure text readability -->
        <div class="absolute inset-0 bg-slate-950/75 backdrop-blur-[2px]"></div>
    </div>

    <!-- Content Container -->
    <div class="relative z-10 flex flex-col items-center justify-center flex-grow px-4 text-center max-w-3xl mx-auto">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white shadow-xl shadow-indigo-500/30 mb-6 border border-indigo-400/30">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        </div>
        <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight mb-4">
            Welcome to <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400">ScholarMatch</span>
        </h1>
        <p class="text-slate-300 text-base sm:text-lg mb-8 leading-relaxed">
            Your AI-powered academic companion to discover global scholarships, connect with research faculty, and streamline your university applications.
        </p>
        
        <!-- Login & Signup Buttons -->
        <div class="flex flex-col sm:flex-row gap-4 w-full sm:w-auto">
            <a href="{{ url_for('auth.login') }}" class="px-8 py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-semibold text-white shadow-lg shadow-indigo-600/30 transition-all hover:scale-105">
                Login
            </a>
            <a href="{{ url_for('auth.register') }}" class="px-8 py-3.5 rounded-xl bg-slate-900/80 hover:bg-slate-800 font-semibold text-white border border-slate-700 backdrop-blur-md transition-all hover:scale-105">
                Sign Up
            </a>
        </div>
    </div>

    <!-- Footer Note -->
    <div class="relative z-10 py-6 text-center text-slate-500 text-xs">
        &copy; 2026 ScholarMatch. All rights reserved.
    </div>

</body>
</html>
